name: triggers

on:
  push:
    branches: [main]
    paths: ["app/**"]          # only when files under app/ change
  pull_request:
    branches: [main]
  workflow_dispatch:           # adds a "Run workflow" button
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        options: [dev, prod]
        default: dev
      dry_run:
        type: boolean
        default: true

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - run: echo "event=${{ github.event_name }}"

      - if: github.event_name == 'workflow_dispatch'
        run: echo "target=${{ inputs.target }} dry_run=${{ inputs.dry_run }}"

      - if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "PR #$PR_NUMBER from $HEAD_REF"

      - if: inputs.target == 'prod' && inputs.dry_run == false
        run: echo "REAL PROD DEPLOY would happen here"

